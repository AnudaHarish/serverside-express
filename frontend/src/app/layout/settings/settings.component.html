<nb-card status="info">
  <nb-card-header>
    <span>Edit User details</span>
  </nb-card-header>
  <nb-card-body>
    <form [formGroup]="formGroup">
      <div class="row mt-2">
        <div class="col-2">
          1.Username
        </div>
        <div class="col">
          <input type="text" nbInput fullWidth fieldSize="small" formControlName="username">
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-2">
          2.Email
        </div>
        <div class="col">
          <input type="email" nbInput fullWidth fieldSize="small" formControlName="email">
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-2">
          3.Change password
        </div>
        <div class="col">
          <div class="row mb-2">
            <div class="col-4">
              <span>Previous Password</span>
            </div>
            <div class="col">
              <input type="password" nbInput fullWidth fieldSize="small" formControlName="pre_password">
            </div>
          </div>
          <div class="row mb-2">
            <div class="col-4">
              <span>New Password</span>
            </div>
            <div class="col">
              <input type="password" nbInput fullWidth fieldSize="small" formControlName="new_password">
            </div>
          </div>
          <div class="row mb-2">
            <div class="col-4">
              <span>Confirm Password</span>
            </div>
            <div class="col">
              <input type="password" nbInput fullWidth fieldSize="small" formControlName="con_password">
            </div>
          </div>
        </div>
      </div>
      <div class="row justify-content-end">
        <div class="col-auto">
          <button nbButton status="success" (click)="saveData()"><nb-icon icon="done-all-outline"></nb-icon>Save</button>
        </div>
      </div>
    </form>
  </nb-card-body>
</nb-card>
