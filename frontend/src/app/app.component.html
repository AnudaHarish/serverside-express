<nb-layout>

  <nb-layout-header subheader>
    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
      <div>
        <button nbButton ghost (click)="toggleSidebar()">
          <nb-icon icon="menu-outline"></nb-icon>
        </button>
      </div>

      <nb-user  name= "{{username}}"
                title= ""
                [nbContextMenu]="isLoggIn ? items2 : items"
                nbContextMenuTag="my-context-menu">
      </nb-user>

<!--      <div>-->
<!--        <button nbButton status="primary" (click)="login()">-->
<!--          <nb-icon icon="log-out-outline"></nb-icon>-->
<!--          login-->
<!--        </button>-->
<!--      </div>-->
    </div>
  </nb-layout-header>
  <nb-sidebar *ngIf="isLoggIn">
    <!-- Add sidebar header -->
    <div class="sidebar-header">
      <nb-card class="sidebar-user-card">
        <nb-card-body>
          <div class="user-info">
            <h5 class="user-name">TravelTales</h5> <!-- Bind to your user data -->
          </div>
        </nb-card-body>
      </nb-card>
    </div>
    <nb-menu [items]="menuItems"></nb-menu>
  </nb-sidebar>
  <nb-layout-column class="colored-column-basic">
    <router-outlet></router-outlet>
  </nb-layout-column>
  <nb-layout-footer fixed>
    <!-- Insert footer here -->
  </nb-layout-footer>

</nb-layout>
